<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Job App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --sidebar-width: 260px; --glass: rgba(255, 255, 255, 0.95); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Style */
        .sidebar { 
            width: var(--sidebar-width); 
            background: white; 
            height: 100%; 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column;
            border-right: 1px solid #ddd;
            position: relative;
        }
        .sidebar.collapsed { width: 70px; }

        .logo-section { padding: 30px 20px; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; }
        .sidebar.collapsed .logo-text { display: none; }

        .nav-links { flex: 1; list-style: none; padding: 10px; }
        .nav-links li { padding: 15px; cursor: pointer; border-radius: 10px; margin-bottom: 5px; transition: 0.2s; display: flex; align-items: center; }
        .nav-links li:hover { background: #f0f0f0; color: #5e35b1; }
        .nav-links i { min-width: 40px; font-size: 1.2rem; }
        .sidebar.collapsed .link-text { display: none; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; background: #fafbfc; transition: 0.3s; }

        /* Header / Toggle */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .toggle-btn { cursor: pointer; font-size: 1.5rem; color: #333; }

        /* Dashboard Cards (Recent Stats) */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px; border: 1px solid #eee; display: flex; align-items: center; gap: 20px; }
        .stat-card i { font-size: 2rem; color: #5e35b1; background: #f3eaff; padding: 15px; border-radius: 50%; }

        /* Table Style */
        .table-container { background: white; padding: 25px; border-radius: 20px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; color: #888; font-weight: 500; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; }
        
        .btn-hire { background: #e6fcf5; color: #0ca678; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; }
        .btn-reject { background: #fff5f5; color: #fa5252; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="logo-section">
            <i class="fas fa-briefcase" style="margin-right: 15px; color: #5e35b1;"></i>
            <span class="logo-text">JobPortal Admin</span>
        </div>
        <ul class="nav-links">
            <li onclick="showSection('home')"><i class="fas fa-home"></i><span class="link-text">Home</span></li>
            <li onclick="showSection('post-job')"><i class="fas fa-plus-circle"></i><span class="link-text">Post a Job</span></li>
            <li onclick="showSection('app-form')"><i class="fas fa-file-invoice"></i><span class="link-text">Application Form</span></li>
            <li onclick="confirmLogout()" style="margin-top: auto; color: #fa5252;"><i class="fas fa-sign-out-alt"></i><span class="link-text">Log out</span></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="top-bar">
            <i class="fas fa-bars toggle-btn" onclick="toggleSidebar()"></i>
            <h2>Welcome, Admin 👋</h2>
        </div>

        <div id="home-section">
            <div class="stats-grid">
                <div class="stat-card"><i class="fas fa-users"></i><div><p>Total Applicants</p><h3 id="count-total">0</h3></div></div>
                <div class="stat-card"><i class="fas fa-check-circle"></i><div><p>Hired</p><h3 id="count-hired">0</h3></div></div>
                <div class="stat-card"><i class="fas fa-clock"></i><div><p>Pending</p><h3 id="count-pending">0</h3></div></div>
            </div>

            <div class="table-container">
                <h3>Recent Applicants</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Applicant Name</th>
                            <th>Job Applied</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recentTableBody">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="post-job-section" style="display:none;">
    <div class="table-container" style="max-width: 500px; margin: 20px auto; background: white; padding: 30px; border-radius: 15px;">
        <h2 style="margin-bottom: 20px; color: #5e35b1;"><i class="fas fa-plus-circle"></i> Post New Job</h2>
        
        <div style="margin-bottom: 15px; text-align: left;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Job Title</label>
            <input type="text" id="job_title" placeholder="e.g. Office Staff" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
        </div>

        <div style="margin-bottom: 20px; text-align: left;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Job Description</label>
            <textarea id="job_description" placeholder="Unsay buhaton ani nga trabaho?" rows="4" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"></textarea>
        </div>

        <button onclick="submitJob()" style="width: 100%; padding: 15px; background: #5e35b1; color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: bold;">
            <i class="fas fa-paper-plane"></i> Post Job Now
        </button>
    </div>
</div>
        <div id="application-form-section" style="display:none;">
    <div class="table-container" style="max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="margin-bottom: 20px; color: #5e35b1;"><i class="fas fa-file-signature"></i> Walk-in Applicant Entry</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left;">
            <div>
                <label style="font-weight: bold;">Job ID (Refer to Jobs Table)</label>
                <input type="number" id="app_job_id" placeholder="e.g. 1" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div>
                <label style="font-weight: bold;">Full Name</label>
                <input type="text" id="app_name" placeholder="John Doe" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div>
                <label style="font-weight: bold;">Email Address</label>
                <input type="email" id="app_email" placeholder="john@example.com" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div>
                <label style="font-weight: bold;">Contact Number</label>
                <input type="text" id="app_contact" placeholder="09123456789" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div>
                <label style="font-weight: bold;">School/Institution</label>
                <input type="text" id="app_school" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div>
                <label style="font-weight: bold;">Degree</label>
                <input type="text" id="app_degree" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div>
                <label style="font-weight: bold;">Year Completed</label>
                <input type="number" id="app_year" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div>
                <label style="font-weight: bold;">Skills/Qualification</label>
                <input type="text" id="app_skills" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
        </div>

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button onclick="submitWalkIn('Hired')" style="flex: 1; background: #28a745; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold;">
                <i class="fas fa-check-circle"></i> Mark as Hired
            </button>
            <button onclick="submitWalkIn('Cancelled')" style="flex: 1; background: #dc3545; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold;">
                <i class="fas fa-times-circle"></i> Cancel Application
            </button>
        </div>
    </div>
</div>
</div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function showSection(name) {
    // I-match nato ang IDs sa imong tinuod nga HTML tags
    const sections = ['home-section', 'post-job-section', 'application-form-section'];
    
    sections.forEach(s => {
        const el = document.getElementById(s);
        if (el) el.style.display = 'none';
    });

    // Karon i-show nato ang saktong section
    let targetId = name + '-section';
    
    // Special case para sa imong Application Form button nga 'app-form' ang tawag
    if (name === 'app-form') {
        targetId = 'application-form-section';
    }

    const target = document.getElementById(targetId);
    if (target) {
        target.style.display = 'block';
    } else {
        console.error("Missing section ID: " + targetId);
    }
}

        function confirmLogout() {
            if (confirm("Are you sure you want to logout?")) {
                window.location.href = 'index.html'; // Balik sa login
            }
        }

        async function fetchRecent() {
            const res = await fetch('http://localhost:3000/api/applicants');
            const data = await res.json();
            const table = document.getElementById('recentTableBody');
            table.innerHTML = '';
            
            // Updates counts
            // Updates counts - Mas sigurado ni nga logic
document.getElementById('count-total').innerText = data.length;

// Gigamitan nato og .toLowerCase() para bisan "hired" o "Hired" ang naa sa DB, ma-ihap gihapon
document.getElementById('count-pending').innerText = data.filter(a => 
    a.application_status && a.application_status.toLowerCase() === 'pending'
).length;

document.getElementById('count-hired').innerText = data.filter(a => 
    a.application_status && a.application_status.toLowerCase() === 'hired'
).length;

            data.slice(-5).forEach(app => { // Show last 5
                table.innerHTML += `
                    <tr>
                        <td>${app.full_name}</td>
                        <td>Job ID: ${app.job_id}</td>
                        <td>${app.email}</td>
                        <td><b>${app.application_status}</b></td>
                        <td>
                            <button class="btn-hire" onclick="updateStatus(${app.applicant_id}, 'Hired')">Hire</button>
                            <button class="btn-reject" onclick="updateStatus(${app.applicant_id}, 'Rejected')">Reject</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateStatus(id, status) {
            await fetch(`http://localhost:3000/api/applicants/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ application_status: status })
            });
            fetchRecent();
        }

        fetchRecent(); // Initial load

        async function submitJob() {
    const title = document.getElementById('job_title').value;
    const desc = document.getElementById('job_description').value;

    if (!title || !desc) {
        alert("Palihug sulati ang Title ug Description!");
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/api/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                job_title: title, 
                job_description: desc 
            })
        });

        const result = await response.json();

        if (response.ok) {
            alert("✅ Job Posted Successfully!");
            document.getElementById('job_title').value = '';
            document.getElementById('job_description').value = '';
            showSection('home'); 
        } else {
            alert("Error: " + result.error);
        }
    } catch (err) {
        alert("Server Error. Siguraduha nga nag-run ang node server.js");
    }
}

async function submitWalkIn(status) {
    const data = {
        job_id: document.getElementById('app_job_id').value,
        full_name: document.getElementById('app_name').value,
        email: document.getElementById('app_email').value,
        contact_no: document.getElementById('app_contact').value,
        school_institution: document.getElementById('app_school').value,
        degree: document.getElementById('app_degree').value,
        year_completed: document.getElementById('app_year').value,
        skills_qualification: document.getElementById('app_skills').value,
        application_status: status // 'Hired' o 'Cancelled' base sa button nga gipislit
    };

    if (!data.job_id || !data.full_name) {
        alert("Palihug butangi ang Job ID ug Full Name!");
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/api/applicants', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert(`✅ Applicant successfully recorded as ${status}!`);
            showSection('home'); // Mobalik sa dashboard table
        } else {
            const err = await response.json();
            alert("Error: " + err.error);
        }
    } catch (error) {
        alert("Server Error. Siguraduha nga nag-run ang server.js");
    }
}
    </script>
</body>
</html>
